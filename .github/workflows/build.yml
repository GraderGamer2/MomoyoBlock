name: Linux x86_64 Wayland playtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml', 'project.godot']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out MomoyoBlock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends scons libwayland-bin libwayland-egl1 libgl1-mesa-dri libegl-mesa0 weston
      - name: Identify the native toolchain
        id: native-toolchain
        run: |
          signature=$(dpkg-query -W gcc g++ binutils libc6-dev libwayland-bin | sha256sum | cut -d ' ' -f 1)
          echo "signature=$signature" >> "$GITHUB_OUTPUT"
      - name: Cache the optimized Godot template
        id: godot-template
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/godot-4.7.2/bin/godot.linuxbsd.template_release.x86_64
          key: momoyo-godot-ubuntu24-x64-${{ steps.native-toolchain.outputs.signature }}-${{ hashFiles('tools/build-linux.sh', 'tools/momoyoblock_runtime.h', 'tools/godot-linux-runtime.patch') }}
      - name: Test, build, and package Linux
        env:
          MOMOYO_TEMPLATE_CACHE_HIT: ${{ steps.godot-template.outputs.cache-hit }}
        run: tools/build-linux.sh
      - name: Verify packaged Wayland window
        run: tools/test-package.sh dist/MomoyoBlock-linux-x86_64.tar.gz
      - name: Upload Linux playtest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/MomoyoBlock-linux-x86_64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14
